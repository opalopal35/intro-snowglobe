<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "utf-8"/>
        <title> my snowglobe </title>
        <link rel = "stylesheet" href = "style.css"/>
    </head>
    <canvas id = "snow-canvas"></canvas>
    <body>
        <header class = "hero">
            <h1> my snowglobe</h1>
            <p class = "tagline"> shake it for facts about me</p>
        </header>
        <main>
            <section class = "globe-card">
                <div class = "globe" id = "globe">
                    <img class = "scene" src = "snowglobe.png" alt = "a snowglobe" />
                </div>
                <button id = "shake"> shake the globe</button>
                <p class = "message" id = "message"> press the button to get a fact about me</p>
            </section>
        </main>
        <footer> 
            <p class = "message" id = "footnote"> made by me, hohoho :)</p>
        </footer>
        <script src = "script.js"></script>
    </body>
</html>
